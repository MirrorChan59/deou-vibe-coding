<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>得欧Vibe Coding 创意梳理工作台</title>
<meta name="description" content="帮助学生把模糊想法梳理成可执行 Web 项目创意方案的交互式工作台">
<style>
:root {
  --blue: #1E5FE0;
  --blue-dark: #1648B0;
  --navy: #0A2540;
  --bg: #FFFFFF;
  --bg-soft: #F4F7FC;
  --text: #33415C;
  --text-light: #64748B;
  --border: #E2E8F2;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(10, 37, 64, .08);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg-soft);
  color: var(--text);
  font-size: 15px;
  line-height: 1.7;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; font-size: 16px; }

/* ===== Header ===== */
.site-header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.site-header .logo {
  height: 34px;
  width: auto;
  border-radius: 6px;
}
.site-header .brand {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}
.site-header .brand .name {
  font-size: 17px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: .02em;
}
.site-header .brand .name em { font-style: normal; color: var(--blue); }
.site-header .brand .sub {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: .14em;
}

/* ===== Layout ===== */
.layout {
  display: flex;
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px 120px;
  gap: 28px;
  align-items: flex-start;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 232px;
  flex-shrink: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 14px;
  position: sticky;
  top: 92px;
}
.step-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  text-align: left;
  color: var(--text-light);
  font-size: 14px;
  transition: background .15s, color .15s;
  min-height: 44px;
}
.step-nav-item:hover { background: var(--bg-soft); }
.step-nav-item.active { background: #EAF1FD; color: var(--blue); font-weight: 700; }
.step-nav-item .num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg-soft);
  color: var(--text-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700;
  flex-shrink: 0;
}
.step-nav-item.active .num { background: var(--blue); color: #fff; }
.step-nav-item.done .num { background: #DDE9FB; color: var(--blue); }
.progress-line {
  margin: 14px 10px 4px;
  height: 6px;
  background: var(--bg-soft);
  border-radius: 3px;
  overflow: hidden;
}
.progress-line .bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--blue-dark));
  border-radius: 3px;
  transition: width .3s;
}
.progress-text { font-size: 12px; color: var(--text-light); padding: 6px 10px 0; }

/* ===== Mobile step bar ===== */
.mobile-stepbar { display: none; }

/* ===== Main ===== */
.main { flex: 1; min-width: 0; }
.step-panel {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px 32px 36px;
  box-shadow: var(--shadow);
}
.step-kicker {
  font-size: 12px;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: .16em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.step-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 6px;
}
.step-desc { color: var(--text-light); margin-bottom: 26px; font-size: 14.5px; }

.field { margin-bottom: 22px; }
.field > label {
  display: block;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
  font-size: 14.5px;
}
.field > label .hint { font-weight: 400; color: var(--text-light); font-size: 13px; margin-left: 8px; }
.field input[type="text"], .field textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  background: #FBFCFE;
  transition: border-color .15s, box-shadow .15s;
}
.field input[type="text"]:focus, .field textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(30, 95, 224, .12);
  background: #fff;
}
.field textarea { min-height: 96px; resize: vertical; }
.field-tip { font-size: 12.5px; color: var(--text-light); margin-top: 6px; }
.field-tip.good { color: var(--blue); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  padding: 9px 18px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--text);
  font-size: 14px;
  transition: all .15s;
  min-height: 40px;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }

/* method cards */
.method-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 8px;
}
.method-card {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  background: #fff;
  text-align: left;
  transition: all .15s;
  position: relative;
  min-height: 44px;
}
.method-card:hover { border-color: var(--blue); transform: translateY(-1px); }
.method-card.on { border-color: var(--blue); background: #F0F6FF; }
.method-card .m-name { font-weight: 700; color: var(--navy); font-size: 15px; margin-bottom: 4px; }
.method-card .m-desc { font-size: 12.5px; color: var(--text-light); line-height: 1.55; }
.method-card .m-check {
  position: absolute;
  top: 12px; right: 12px;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
}
.method-card.on .m-check { background: var(--blue); border-color: var(--blue); color: #fff; }
.method-detail {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: var(--bg-soft);
  padding: 18px 20px;
  margin-bottom: 20px;
  font-size: 13.5px;
}
.method-detail h4 { color: var(--navy); font-size: 14.5px; margin-bottom: 10px; }
.method-detail .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.method-detail ul { padding-left: 18px; }
.method-detail li { margin-bottom: 4px; }
.method-detail .pros { color: #15803D; }
.method-detail .cons { color: #B45309; }

/* features */
.feature-item {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  background: #fff;
}
.feature-item.mvp { border-color: var(--blue); background: #F6FAFF; }
.feature-row { display: flex; gap: 10px; align-items: flex-start; }
.feature-row .f-inputs { flex: 1; display: grid; gap: 8px; }
.feature-row input[type="text"] {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  width: 100%;
  background: #FBFCFE;
}
.feature-row input[type="text"]:focus { outline: none; border-color: var(--blue); background:#fff; }
.f-mvp-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  font-size: 13px;
  color: var(--text-light);
  min-height: 40px;
  white-space: nowrap;
}
.feature-item.mvp .f-mvp-btn { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.f-del { flex-shrink: 0; color: #C0CBDD; font-size: 18px; padding: 8px; min-width: 40px; min-height: 40px; }
.f-del:hover { color: #DC2626; }
.add-feature-btn {
  width: 100%;
  padding: 12px;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  color: var(--text-light);
  font-size: 14px;
  min-height: 48px;
}
.add-feature-btn:hover { border-color: var(--blue); color: var(--blue); }
.quick-chips { margin-top: 14px; }
.quick-chips .qc-label { font-size: 12.5px; color: var(--text-light); margin-bottom: 8px; }

/* scoring */
.score-hero {
  background: linear-gradient(135deg, var(--navy), #143A66);
  border-radius: var(--radius);
  color: #fff;
  padding: 26px 28px;
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 24px;
}
.score-hero .big { font-size: 52px; font-weight: 900; line-height: 1; }
.score-hero .big small { font-size: 18px; font-weight: 400; opacity: .6; }
.score-hero .grade { font-size: 15px; opacity: .9; }
.score-hero .grade strong { font-size: 20px; display: block; margin-top: 2px; }
.score-hero .suggest { flex: 1; font-size: 13.5px; opacity: .85; text-align: right; }
.dim-item {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
  background: #fff;
}
.dim-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.dim-head .d-name { font-weight: 700; color: var(--navy); }
.dim-head .d-score { font-weight: 800; color: var(--blue); font-size: 17px; }
.dim-bar { height: 8px; border-radius: 4px; background: var(--bg-soft); overflow: hidden; margin-bottom: 8px; }
.dim-bar .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--blue-dark)); transition: width .4s; }
.dim-sugg { font-size: 13px; color: var(--text-light); }
.dim-sugg.warn { color: #B45309; }

/* output */
.output-preview {
  background: var(--navy);
  color: #D7E3F5;
  border-radius: var(--radius);
  padding: 24px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 480px;
  overflow-y: auto;
  margin-bottom: 18px;
}
.output-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  min-height: 48px;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-ghost { border: 1.5px solid var(--border); color: var(--text); background: #fff; }
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }

/* bottom nav */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 22px;
  gap: 12px;
}

/* ===== Case library ===== */
.case-fab {
  position: fixed;
  right: 22px;
  bottom: 22px;
  background: var(--navy);
  color: #fff;
  padding: 13px 22px;
  border-radius: 999px;
  font-size: 14.5px;
  font-weight: 700;
  box-shadow: 0 6px 24px rgba(10, 37, 64, .3);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
}
.case-fab:hover { background: #143A66; }
.case-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 37, 64, .45);
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.case-overlay.open { opacity: 1; pointer-events: auto; }
.case-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(460px, 100%);
  background: #FFFFFF;
  z-index: 100;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.32,.72,.35,1);
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 40px rgba(10, 37, 64, .18);
}
.case-drawer.open { transform: translateX(0); }
.case-drawer-head {
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  background: #fff;
}
.case-drawer-head h3 { font-size: 19px; font-weight: 800; color: var(--navy); }
.case-drawer-head p { font-size: 13px; color: var(--text-light); margin-top: 2px; }
.case-close {
  font-size: 22px;
  color: var(--text-light);
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  flex-shrink: 0;
}
.case-close:hover { background: var(--bg-soft); color: var(--navy); }
.case-filter-row {
  display: flex;
  gap: 8px;
  padding: 14px 22px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: #fff;
  -webkit-overflow-scrolling: touch;
}
.case-filter-row::-webkit-scrollbar { display: none; }
.case-filter-row .chip { flex-shrink: 0; padding: 7px 15px; font-size: 13px; min-height: 36px; }
.case-list {
  flex: 1;
  overflow-y: auto;
  padding: 18px 22px 40px;
  background: #FFFFFF;
  -webkit-overflow-scrolling: touch;
}
.case-card {
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 18px;
  background: #fff;
  cursor: pointer;
  transition: all .18s;
}
.case-card:hover { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-2px); }
.case-card .cc-img { position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--bg-soft); }
.case-card .cc-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.case-card:hover .cc-img img { transform: scale(1.04); }
.case-card .cc-cat {
  position: absolute;
  top: 12px; left: 12px;
  background: rgba(255,255,255,.94);
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
}
.case-card .cc-body { padding: 15px 17px 17px; }
.case-card .cc-name { font-weight: 800; color: var(--navy); font-size: 16.5px; margin-bottom: 5px; }
.case-card .cc-desc { font-size: 13.5px; color: var(--text-light); line-height: 1.6; margin-bottom: 10px; }
.case-card .cc-meta { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-light); }
.case-card .cc-meta b { color: var(--blue); font-weight: 700; }

/* case detail */
.case-detail { flex: 1; overflow-y: auto; background: #FFFFFF; -webkit-overflow-scrolling: touch; }
.case-detail .cd-hero { aspect-ratio: 16/9; overflow: hidden; background: var(--bg-soft); }
.case-detail .cd-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.case-detail .cd-body { padding: 20px 24px 40px; }
.case-detail .cd-cat {
  display: inline-block;
  background: #EAF1FD;
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.case-detail h2 { font-size: 21px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.case-detail .cd-sub { color: var(--text-light); font-size: 14px; margin-bottom: 18px; }
.case-detail .cd-meta { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px; color: var(--text-light); }
.case-detail .cd-meta b { color: var(--blue); }
.cd-block { margin-bottom: 18px; }
.cd-block .cd-label {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: .08em;
  margin-bottom: 6px;
}
.cd-block p { font-size: 14.5px; line-height: 1.75; color: var(--text); }
.cd-block.takeaway {
  background: #F0F6FF;
  border-left: 4px solid var(--blue);
  border-radius: 0 12px 12px 0;
  padding: 14px 16px;
}
.case-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--blue);
  font-weight: 700;
  font-size: 14px;
  padding: 10px 0;
  min-height: 44px;
}
.cd-apply {
  width: 100%;
  margin-top: 10px;
}

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%) translateY(20px);
  background: var(--navy);
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
  max-width: 86vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Mobile ===== */
@media (max-width: 860px) {
  .site-header { padding: 0 16px; height: 58px; }
  .site-header .logo { height: 28px; }
  .site-header .brand .name { font-size: 15px; }
  .site-header .brand .sub { font-size: 11px; }
  .layout { padding: 0 0 100px; display: block; }
  .sidebar { display: none; }
  .mobile-stepbar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    position: sticky;
    top: 58px;
    z-index: 40;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .mobile-stepbar::-webkit-scrollbar { display: none; }
  .ms-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--text-light);
    font-size: 12.5px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ms-dot.active { background: var(--blue); color: #fff; }
  .ms-dot.done { background: #DDE9FB; color: var(--blue); }
  .ms-line { flex: 1; min-width: 8px; height: 2px; background: var(--border); flex-shrink: 0; }
  .ms-label { font-size: 13px; font-weight: 700; color: var(--navy); white-space: nowrap; margin-left: 6px; }
  .step-panel { border-radius: 0; border-left: none; border-right: none; padding: 22px 18px 30px; box-shadow: none; }
  .step-title { font-size: 21px; }
  .method-detail .cols { grid-template-columns: 1fr; }
  .score-hero { flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px; }
  .score-hero .suggest { text-align: left; }
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 60;
    margin-top: 0;
  }
  .bottom-nav .btn { flex: 1; }
  .case-fab { right: 14px; bottom: calc(78px + env(safe-area-inset-bottom)); padding: 11px 18px; }
  .case-drawer { width: 100%; }
  .output-actions .btn { flex: 1; }
}
</style>
</head>
<body>

<header class="site-header">
  <img class="logo" src="assets/logo.jpg" alt="得欧 IDO">
  <div class="brand">
    <span class="name">得欧<em>Vibe Coding</em></span>
    <span class="sub">创意梳理工作台</span>
  </div>
</header>

<div class="mobile-stepbar" id="mobileStepbar"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <section class="step-panel" id="stepPanel"></section>
    <div class="bottom-nav">
      <button class="btn btn-ghost" id="prevBtn">← 上一步</button>
      <button class="btn btn-primary" id="nextBtn">下一步 →</button>
    </div>
  </main>
</div>

<button class="case-fab" id="caseFab">📚 案例库</button>

<div class="case-overlay" id="caseOverlay"></div>
<div class="case-drawer" id="caseDrawer" role="dialog" aria-label="优秀 Vibe Coding 案例库"></div>

<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const TYPE_TAGS = ['AI 应用', '效率工具', '生活方式', '教育学习', '社区社交', '数据可视化'];
const QUICK_FEATURES = ['用户注册登录', '数据统计看板', '搜索与筛选', '一键分享', '消息通知', '个人中心'];

const METHODS = [
  { id: 'interview', name: '用户访谈', desc: '找 3-5 个目标用户深聊，验证痛点是否真实存在',
    steps: ['列出 5-8 个开放式问题', '找 3-5 个目标用户各聊 20 分钟', '记录原话，不急着给方案', '归纳出 3 个最高频痛点'],

/* ================= 状态 ================= */
const defaultState = () => ({
  step: 0,
  projectName: '', problem: '', inspiration: '', typeTags: [],
  targetUsers: '', persona: '', scenario: '', painPoints: '',
  researchMethods: [], competitors: '', marketSize: '', researchNotes: '',
  features: [{ name: '', desc: '', mvp: true }],
  valueProposition: '',
});
let state = defaultState();
try {
  const saved = localStorage.getItem('vibe-workshop-state');
  if (saved) state = Object.assign(defaultState(), JSON.parse(saved));
} catch (e) {}
const save = () => localStorage.setItem('vibe-workshop-state', JSON.stringify(state));

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderNav() {
  $('#sidebar').innerHTML = STEPS.map((s, i) => `
    <button class="step-nav-item ${i === state.step ? 'active' : ''} ${i < state.step ? 'done' : ''}" data-step="${i}">
      <span class="num">${i < state.step ? '✓' : i + 1}</span>
      <span>${s.name}</span>
    </button>`).join('') + `
    <div class="progress-line"><div class="bar" style="width:${Math.round(state.step / (STEPS.length - 1) * 100)}%"></div></div>
    <div class="progress-text">${state.step + 1} / ${STEPS.length} · 自动保存中</div>`;
  $('#mobileStepbar').innerHTML = STEPS.map((s, i) => `
    ${i > 0 ? '<span class="ms-line"></span>' : ''}
    <button class="ms-dot ${i === state.step ? 'active' : ''} ${i < state.step ? 'done' : ''}" data-step="${i}">${i < state.step ? '✓' : i + 1}</button>`).join('') +
    `<span class="ms-label">${STEPS[state.step].name}</span>`;
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { state.step = +b.dataset.step; save(); renderAll(); window.scrollTo({top: 0}); });
}

function fieldText(id, label, key, placeholder, hint) {
  return `<div class="field"><label for="${id}">${label}${hint ? `<span class="hint">${hint}</span>` : ''}</label>
    <input type="text" id="${id}" data-bind="${key}" value="${esc(state[key])}" placeholder="${esc(placeholder)}"></div>`;
}
function fieldArea(id, label, key, placeholder, hint, tip) {
  return `<div class="field"><label for="${id}">${label}${hint ? `<span class="hint">${hint}</span>` : ''}</label>
    <textarea id="${id}" data-bind="${key}" placeholder="${esc(placeholder)}">${esc(state[key])}</textarea>
    ${tip ? `<div class="field-tip">${tip}</div>` : ''}</div>`;
}

function renderStep() {
  const s = STEPS[state.step];
  $('#stepPanel').innerHTML = `
    <div class="step-kicker">${s.kicker}</div>
    <h2 class="step-title">${s.name}</h2>
    <p class="step-desc">${s.desc}</p>
    ${RENDERERS[s.id]()}`;
  $('#prevBtn').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  $('#nextBtn').textContent = state.step === STEPS.length - 1 ? '完成 ✓' : '下一步 →';
  bindStepEvents();
}

function bindStepEvents() {
  document.querySelectorAll('[data-bind]').forEach(el => {
    el.oninput = () => { state[el.dataset.bind] = el.value; save(); };
  });
  document.querySelectorAll('[data-tag]').forEach(el => {
    el.onclick = () => {
      const t = el.dataset.tag;
      state.typeTags = state.typeTags.includes(t) ? state.typeTags.filter(x => x !== t) : [...state.typeTags, t];
      save(); renderStep();
    };
  });
  document.querySelectorAll('[data-method]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.method;
      if (!state.researchMethods.includes(id)) {
        state.researchMethods = [...state.researchMethods, id];
        save(); renderStep();
      }
      showMethodDetail(id);
    };
  });
  document.querySelectorAll('[data-fname]').forEach(el => { el.oninput = () => { state.features[+el.dataset.fname].name = el.value; save(); }; });
  document.querySelectorAll('[data-fdesc]').forEach(el => { el.oninput = () => { state.features[+el.dataset.fdesc].desc = el.value; save(); }; });
  document.querySelectorAll('[data-fmvp]').forEach(el => {
    el.onclick = () => { const f = state.features[+el.dataset.fmvp]; f.mvp = !f.mvp; save(); renderStep(); };
  });
  document.querySelectorAll('[data-fdel]').forEach(el => {
    el.onclick = () => {
      if (state.features.length <= 1) { toast('至少保留一个功能'); return; }
      state.features.splice(+el.dataset.fdel, 1); save(); renderStep();
    };
  });
  const addBtn = $('#addFeature');
  if (addBtn) addBtn.onclick = () => { state.features.push({ name: '', desc: '', mvp: false }); save(); renderStep(); };
  document.querySelectorAll('[data-quick]').forEach(el => {
    el.onclick = () => { state.features.push({ name: el.dataset.quick, desc: '', mvp: false }); save(); renderStep(); };
  });
  const gvp = $('#genValueProp');
  if (gvp) gvp.onclick = () => {
    const u = state.targetUsers || '[目标用户]';
    const p = (state.painPoints || state.problem || '[核心痛点]').split(/[。；;\n]/)[0] || '[核心痛点]';
    const mvp = state.features.find(f => f.mvp && f.name);
    const f = mvp ? mvp.name : '[核心功能]';
    state.valueProposition = `帮助${u}解决「${p}」，通过「${f}」。`;
    save(); renderStep(); toast('已生成，可继续修改');
  };
  const cp = $('#copyMd');
  if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(buildMarkdown()); toast('已复制到剪贴板'); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = buildMarkdown(); document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast('已复制到剪贴板');
    }
  };
  const dl = $('#downloadMd');
  if (dl) dl.onclick = () => {
    const name = (state.projectName || 'vibe-coding-idea').replace(/[\\/:*?"<>|]/g, '-');
    const blob = new Blob([buildMarkdown()], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name}-创意方案.md`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已开始下载');
  };
  const rs = $('#resetAll');
  if (rs) rs.onclick = () => {
    if (confirm('确定清空所有已填内容并重填吗？')) { state = defaultState(); save(); renderAll(); toast('已清空'); }
  };
}

function showMethodDetail(id) {
  const m = METHODS.find(x => x.id === id);
  if (!m) return;
  const slot = $('#methodDetailSlot');
  const isOn = state.researchMethods.includes(id);
  slot.innerHTML = `
    <div class="method-detail">
      <h4>${m.name} · 实施指南</h4>
      <ul style="margin-bottom:10px">${m.steps.map(s => `<li>${s}</li>`).join('')}</ul>
      <div class="cols">
        <div class="pros">✓ 优势：${m.pros}</div>
        <div class="cons">⚠ 局限：${m.cons}</div>
      </div>
      ${isOn ? `<button class="case-back" id="unselectMethod" style="color:#B45309">取消选择该方法</button>` : ''}
    </div>`;
  const un = $('#unselectMethod');
  if (un) un.onclick = () => {
    state.researchMethods = state.researchMethods.filter(x => x !== id);
    save(); renderStep();
  };
}

/* ================= 评分 ================= */
function lenScore(text, full = 60) {
  const n = (text || '').trim().length;
  if (n === 0) return 0;
  if (n < 15) return 45;
  if (n < full) return 65 + Math.round((n - 15) / (full - 15) * 20);
  return 90;
}
function computeScores() {
  const p1 = Math.round((lenScore(state.problem) + lenScore(state.painPoints)) / 2);
  const p2 = Math.round((lenScore(state.targetUsers, 20) + lenScore(state.marketSize, 25) + lenScore(state.scenario)) / 3);
  const p3 = Math.round((lenScore(state.competitors) * 0.6 + lenScore(state.inspiration) * 0.4));
  const mvpCount = state.features.filter(f => f.mvp && f.name.trim()).length;
  const totalCount = state.features.filter(f => f.name.trim()).length;
  let p4 = 0;
  if (totalCount > 0) {
    p4 = mvpCount === 0 ? 50 : mvpCount <= 3 ? (totalCount <= 5 ? 88 : 75) : 62;
  }
  const p5 = Math.round((lenScore(state.valueProposition) * 0.6 + Math.min(state.researchMethods.length, 3) / 3 * 100 * 0.4));
  return [
    { name: '需求强度', score: p1, sugg: '回到「灵感起源」和「用户画像」，把问题和痛点写得更具体——越具体越说明需求真实。' },
    { name: '市场空间', score: p2, sugg: '补充目标人群规模估算和使用场景描述，哪怕粗略估算也比空白好。' },
    { name: '差异化程度', score: p3, sugg: '在「商业调研」里写下 2-3 个竞品，并说清楚你的不同在哪。' },
    { name: '实现可行性', score: p4, sugg: 'MVP 功能控制在 1-3 个；功能总清单超过 5 个时，砍掉第一版用不到的。' },
    { name: '商业潜力', score: p5, sugg: '生成或手写一句话价值主张，并在调研方法里至少勾选 2 种验证手段。' },
  ];
}

/* ================= Markdown 输出 ================= */
function buildMarkdown() {
  const dims = computeScores();
  const total = Math.round(dims.reduce((a, d) => a + d.score, 0) / dims.length);
  const grade = total >= 80 ? '优秀' : total >= 60 ? '中等' : '待加强';
  const v = (s, ph = '（未填写）') => (s || '').trim() || ph;
  const methodNames = state.researchMethods.map(id => (METHODS.find(m => m.id === id) || {}).name).filter(Boolean);
  const featureLines = state.features.filter(f => f.name.trim()).map((f, i) =>
    `${i + 1}. ${f.mvp ? '⭐ [MVP] ' : ''}${f.name.trim()}${f.desc.trim() ? ' — ' + f.desc.trim() : ''}`);
  const mvpNames = state.features.filter(f => f.mvp && f.name.trim()).map(f => f.name.trim());
  return `# ${v(state.projectName, '未命名项目')} — Vibe Coding 创意方案

> 由得欧Vibe Coding 创意梳理工作台生成

## 一、灵感起源

- **项目名称**：${v(state.projectName)}
- **要解决的问题**：${v(state.problem)}
- **项目类型**：${state.typeTags.length ? state.typeTags.join(' / ') : '（未选择）'}
- **灵感来源**：${v(state.inspiration)}

## 二、用户画像

- **目标人群**：${v(state.targetUsers)}
- **典型用户**：${v(state.persona)}
- **使用场景**：${v(state.scenario)}
- **核心痛点**：${v(state.painPoints)}

## 三、商业调研

- **计划使用的调研方法**：${methodNames.length ? methodNames.join('、') : '（未选择）'}
- **竞品分析**：${v(state.competitors)}
- **市场规模估算**：${v(state.marketSize)}
- **调研笔记**：${v(state.researchNotes)}

## 四、核心功能

**价值主张**：${v(state.valueProposition)}

**功能清单**：
${featureLines.length ? featureLines.join('\n') : '（未填写）'}

## 五、方案评分

- 综合评分：**${total} / 100（${grade}）**
${dims.map(d => `- ${d.name}：${d.score}`).join('\n')}

## 六、给 AI 编程工具的初始 Prompt

请帮我构建一个响应式 Web 应用「${v(state.projectName, '未命名项目')}」。

- 目标用户：${v(state.targetUsers, '待定')}
- 解决的问题：${v(state.problem, '待定')}
- 核心痛点：${v(state.painPoints, '待定')}
- 第一版 MVP 必须包含的功能：${mvpNames.length ? mvpNames.join('；') : '待定'}
- 使用场景：${v(state.scenario, '待定')}

要求：界面简洁现代、移动端可用、无需后端即可运行的纯前端实现优先。先给出技术方案再开始编码。`;
}

/* ================= 案例库 ================= */
let caseFilter = '全部';
let caseDetail = null;
const CASE_CATS = ['全部', 'AI 应用', '效率工具', '生活方式', '教育学习', '社区社交'];

function renderCaseDrawer() {
  const d = $('#caseDrawer');
  if (caseDetail) {
    const c = caseDetail;
    d.innerHTML = `
      <div class="case-drawer-head">
        <div><button class="case-back" id="caseBack">← 返回列表</button></div>
        <button class="case-close" id="caseClose" aria-label="关闭">×</button>
      </div>
      <div class="case-detail">
        <div class="cd-hero"><img src="${c.img}" alt="${esc(c.name)}" loading="lazy"></div>
        <div class="cd-body">
          <span class="cd-cat">${c.cat}</span>
          <h2>${esc(c.name)}</h2>
          <div class="cd-sub">${esc(c.title)}</div>
          <div class="cd-meta"><span>🚀 MVP 周期：<b>${c.mvp}</b></span><span>👥 <b>${c.users}</b></span></div>
          <div class="cd-block"><div class="cd-label">产品介绍</div><p>${esc(c.desc)}</p></div>
          <div class="cd-block"><div class="cd-label">核心洞察</div><p>${esc(c.insight)}</p></div>
          <div class="cd-block"><div class="cd-label">亮点特色</div><p>${esc(c.highlight)}</p></div>
          <div class="cd-block"><div class="cd-label">商业模式</div><p>${esc(c.business)}</p></div>
          <div class="cd-block takeaway"><div class="cd-label">💡 带给你的启发</div><p>${esc(c.takeaway)}</p></div>
          <button class="btn btn-primary cd-apply" id="applyCase">💡 应用到我的项目</button>
        </div>
      </div>`;
    $('#caseBack').onclick = () => { caseDetail = null; renderCaseDrawer(); };
    $('#caseClose').onclick = closeCaseDrawer;
    $('#applyCase').onclick = () => {
      state.inspiration = `参考 ${c.name}：${c.takeaway}`;
      if (!state.typeTags.includes(c.cat) && TYPE_TAGS.includes(c.cat)) state.typeTags = [...state.typeTags, c.cat];
      save(); closeCaseDrawer();
      if (state.step !== 0) { state.step = 0; save(); }
      renderAll();
      toast(`已把「${c.name}」的启发填入灵感来源`);
    };
    return;
  }
  const list = CASES.filter(c => caseFilter === '全部' || c.cat === caseFilter);
  d.innerHTML = `
    <div class="case-drawer-head">
      <div><h3>优秀 Vibe Coding 案例库</h3><p>${CASES.length} 个成功项目的创意拆解</p></div>
      <button class="case-close" id="caseClose" aria-label="关闭">×</button>
    </div>
    <div class="case-filter-row">
      ${CASE_CATS.map(t => `<button class="chip ${caseFilter === t ? 'on' : ''}" data-cat="${t}">${t}</button>`).join('')}
    </div>
    <div class="case-list">
      ${list.map(c => `
        <div class="case-card" data-case="${c.id}">
          <div class="cc-img"><img src="${c.img}" alt="${esc(c.name)}" loading="lazy"><span class="cc-cat">${c.cat}</span></div>
          <div class="cc-body">
            <div class="cc-name">${esc(c.name)} — ${esc(c.title)}</div>
            <div class="cc-desc">${esc(c.desc)}</div>
            <div class="cc-meta"><span>🚀 MVP 周期：<b>${c.mvp}</b></span><span>👥 <b>${c.users}</b></span></div>
          </div>
        </div>`).join('') || '<p style="color:var(--text-light);text-align:center;padding:40px 0">该分类暂无案例</p>'}
    </div>`;
  $('#caseClose').onclick = closeCaseDrawer;
  d.querySelectorAll('[data-cat]').forEach(el => { el.onclick = () => { caseFilter = el.dataset.cat; renderCaseDrawer(); }; });
  d.querySelectorAll('[data-case]').forEach(el => {
    el.onclick = () => { caseDetail = CASES.find(c => c.id === el.dataset.case); renderCaseDrawer(); };
  });
}

function openCaseDrawer() {
  caseDetail = null;
  renderCaseDrawer();
  $('#caseOverlay').classList.add('open');
  $('#caseDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCaseDrawer() {
  caseDetail = null;
  $('#caseOverlay').classList.remove('open');
  $('#caseDrawer').classList.remove('open');
  document.body.style.overflow = '';
}
$('#caseFab').onclick = openCaseDrawer;
$('#caseOverlay').onclick = closeCaseDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCaseDrawer(); });

/* ================= 步骤切换 ================= */
$('#prevBtn').onclick = () => { if (state.step > 0) { state.step--; save(); renderAll(); window.scrollTo({top: 0}); } };
$('#nextBtn').onclick = () => {
  if (state.step < STEPS.length - 1) { state.step++; save(); renderAll(); window.scrollTo({top: 0}); }
  else toast('方案已完成，可复制或下载文档');
};

function renderAll() { renderNav(); renderStep(); }
renderAll();
</script>
