<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>得欧Vibe Coding 创意梳理工作台</title>
  <style>
    :root {
      /* 主色板 —— 白 + 蓝 + 深蓝 专业商务风 */
      --paper: #FFFFFF;
      --paper-dark: #F5F7FA;
      --paper-darker: #EEF2F7;
      --ink: #1A2B4A;
      --ink-soft: #4A5A7A;
      --ink-faint: #8A9AB5;
      --blue: #1E5FE0;
      --blue-soft: #4A86F0;
      --blue-faint: #E0ECFF;
      --deep-blue: #0A2540;
      --deep-blue-soft: #1E3A5F;
      --mint: #2E9E8A;
      --mint-soft: #5DBDA8;
      --coral: #E8726A;
      --coral-soft: #F4B5AF;
      --line: #DCE3EE;
      --line-soft: #E8EEF5;
      --sticky-yellow: #FFF8E0;
      --sticky-blue: #E6F0FF;
      --sticky-green: #E0F4EE;
      --sticky-purple: #EEE6FF;
      --sticky-orange: #FFEFE0;
    }

    [data-theme="dark"] {
      --paper: #0A2540;
      --paper-dark: #0F1F35;
      --paper-darker: #0A1628;
      --ink: #F0F4FA;
      --ink-soft: #B8C5D9;
      --ink-faint: #6A7A95;
      --line: #2A3E5C;
      --line-soft: #1F3352;
      --blue: #4A86F0;
      --blue-soft: #1E5FE0;
      --blue-faint: #1A3050;
      --deep-blue: #E6F0FF;
      --sticky-yellow: #3D3520;
      --sticky-blue: #1A2E50;
      --sticky-green: #1A3D35;
      --sticky-purple: #2A2540;
      --sticky-orange: #3D2A1A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
      background-size: 32px 32px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* 侧边导航 */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--paper-dark);
      border-right: 1px dashed var(--line);
      padding: 32px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      margin-bottom: 32px;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .sidebar-logo-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .sidebar-logo-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-logo-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.5px;
    }

    .sidebar-logo-en {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
    }

    .sidebar-title {
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .step-item:hover {
      background: var(--paper);
    }

    .step-item.active {
      background: var(--blue-faint);
    }

    .step-item.completed .step-num {
      background: var(--mint);
      color: white;
    }

    .step-item.active .step-num {
      background: var(--blue);
      color: white;
      transform: scale(1.1);
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.3s ease;
      color: var(--ink-soft);
    }

    .step-text {
      flex: 1;
      padding-top: 2px;
    }

    .step-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.4;
    }

    .step-desc {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .sidebar-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed var(--line);
    }

    .progress-label {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 8px;
      background: var(--paper);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--blue));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* 主内容区 */
    .main-content {
      flex: 1;
      padding: 48px 64px;
      max-width: 900px;
    }

    .step-header {
      margin-bottom: 40px;
    }

    .step-eyebrow {
      font-size: 13px;
      color: var(--blue);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .step-title {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--deep-blue);
      margin-top: 8px;
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    .step-subtitle {
      font-size: 15px;
      color: var(--ink-soft);
      margin-top: 12px;
      line-height: 1.7;
      max-width: 600px;
    }

    /* 信息卡片（原便利贴风格升级为商务卡） */
    .sticky-card {
      background: var(--paper);
      padding: 24px 28px;
      border-radius: 12px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      box-shadow: 0 2px 8px rgba(30, 95, 224, 0.06);
      position: relative;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .sticky-card:hover {
      box-shadow: 0 4px 16px rgba(30, 95, 224, 0.1);
      border-left-color: var(--deep-blue);
    }

    .sticky-card.pink { border-left-color: #C06B8A; background: #FFFAFB; }
    .sticky-card.blue { border-left-color: var(--blue); background: #F5F9FF; }
    .sticky-card.green { border-left-color: var(--mint); background: #F4FBF9; }
    .sticky-card.orange { border-left-color: #E88A3A; background: #FFFAF5; }

    .sticky-card::before {
      content: '';
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--blue-faint);
      opacity: 0.5;
    }

    .sticky-card.pink::before { background: #FCE4EC; }
    .sticky-card.blue::before { background: var(--blue-faint); }
    .sticky-card.green::before { background: #D4F0E8; }
    .sticky-card.orange::before { background: #FFE0C2; }

    .sticky-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .sticky-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink);
    }

    /* 表单元素 */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 8px;
      display: block;
    }

    .form-label .hint {
      font-weight: 400;
      color: var(--ink-faint);
      font-size: 12px;
      margin-left: 8px;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--paper);
      color: var(--ink);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(238, 136, 51, 0.15);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.7;
    }

    .form-textarea.large {
      min-height: 160px;
    }

    /* 标签选择器 */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-item {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1.5px solid var(--line);
      background: var(--paper);
      color: var(--ink-soft);
      user-select: none;
    }

    .tag-item:hover {
      border-color: var(--blue-soft);
      color: var(--blue);
    }

    .tag-item.selected {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    /* 功能卡片列表 */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .feature-item:hover {
      border-color: var(--blue-soft);
    }

    .feature-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue-faint);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .feature-content {
      flex: 1;
    }

    .feature-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      outline: none;
      padding: 0;
      margin-bottom: 4px;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .feature-desc {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      color: var(--ink-soft);
      outline: none;
      padding: 0;
      resize: none;
      font-family: 'Noto Sans SC', sans-serif;
      line-height: 1.5;
    }

    .feature-delete {
      background: none;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
      font-size: 18px;
      line-height: 1;
    }

    .feature-delete:hover {
      color: var(--coral);
      background: var(--coral-soft);
    }

    .add-feature-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1.5px dashed var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--ink-faint);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .add-feature-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-faint);
    }

    /* 按钮 */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px dashed var(--line);
    }

    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      font-family: 'Noto Sans SC', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 4px 12px rgba(30, 95, 224, 0.25);
    }

    .btn-primary:hover {
      background: var(--deep-blue);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 95, 224, 0.3);
    }

    .btn-secondary {
      background: var(--paper);
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
    }

    .btn-secondary:hover {
      border-color: var(--ink-faint);
      color: var(--ink);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 灵感提示气泡 */
    .tip-bubble {
      background: linear-gradient(135deg, var(--blue-faint) 0%, #F0F6FF 100%);
      padding: 18px 22px;
      border-radius: 12px;
      position: relative;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink);
      border: 1px solid var(--blue-faint);
    }

    .tip-label {
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tip-label::before {
      content: '';
      width: 4px;
      height: 4px;
      background: var(--blue);
      border-radius: 50%;
    }

    /* 输出文档样式 */
    .output-doc {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      padding: 48px;
      border: 1px solid var(--line);
    }

    [data-theme="dark"] .output-doc {
      background: var(--paper-dark);
    }

    .output-title {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .output-meta {
      font-size: 13px;
      color: var(--ink-faint);
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .output-section {
      margin-bottom: 28px;
    }

    .output-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .output-section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: var(--blue);
      border-radius: 2px;
    }

    .output-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink-soft);
    }

    .output-features {
      list-style: none;
      padding: 0;
    }

    .output-features li {
      padding: 10px 0;
      border-bottom: 1px dashed var(--line);
      display: flex;
      gap: 12px;
    }

    .output-features li:last-child {
      border-bottom: none;
    }

    .output-feature-name {
      font-weight: 500;
      color: var(--ink);
      min-width: 100px;
    }

    .output-feature-desc {
      color: var(--ink-soft);
      font-size: 14px;
    }

    .output-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .output-tag {
      padding: 4px 12px;
      background: var(--blue-faint);
      color: var(--blue);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    /* 空状态 */
    .empty-hint {
      text-align: center;
      padding: 20px;
      color: var(--ink-faint);
      font-size: 13px;
      font-style: italic;
    }

    /* 高亮下划线 */
    .handwritten {
      font-family: 'Caveat', cursive;
    }

    .scribble-underline {
      position: relative;
      display: inline-block;
      color: var(--blue);
    }

    .scribble-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--blue-faint);
      border-radius: 2px;
      z-index: -1;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 16px 20px;
        border-right: none;
        border-bottom: 1px dashed var(--line);
      }
      .sidebar-header { margin-bottom: 16px; }
      .step-list { flex-direction: row; overflow-x: auto; gap: 8px; }
      .step-item { min-width: 140px; flex-shrink: 0; }
      .step-desc { display: none; }
      .sidebar-footer { display: none; }
      .main-content { padding: 24px 20px; }
      .step-title { font-size: 26px; }
      .output-doc { padding: 24px; }
    }

    /* 顶部操作栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* 复选框组 */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: var(--ink-soft);
      user-select: none;
    }

    .checkbox-item:hover {
      border-color: var(--blue-soft);
    }

    .checkbox-item.checked {
      border-color: var(--blue);
      background: var(--blue-faint);
      color: var(--ink);
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .checkbox-item.checked .checkbox-box {
      background: var(--blue);
      border-color: var(--blue);
    }

    .checkbox-item.checked .checkbox-box::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* 技术栈卡片 */
    .tech-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .tech-card {
      padding: 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--paper);
    }

    .tech-card:hover {
      border-color: var(--blue-soft);
      transform: translateY(-2px);
    }

    .tech-card.selected {
      border-color: var(--blue);
      background: var(--blue-faint);
    }

    .tech-card-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .tech-card-desc {
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.5;
    }

    /* 风格预览卡片 */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .style-card {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      background: var(--paper);
    }

    .style-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .style-card.selected {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(238, 136, 51, 0.15);
    }

    .style-preview {
      height: 120px;
      position: relative;
      overflow: hidden;
    }

    .style-info {
      padding: 12px 16px;
    }

    .style-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .style-desc {
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.4;
    }

    /* 复制成功提示 */
    .copy-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .copy-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 案例库抽屉 */
    .case-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 990;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .case-drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .case-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(480px, 92vw);
      height: 100vh;
      background: #ffffff;
      z-index: 1000;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
    }

    .case-drawer.open {
      transform: translateX(0);
    }

    .case-drawer-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .case-drawer-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--deep-blue);
    }

    .case-drawer-subtitle {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .case-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      color: var(--ink);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .case-close-btn:hover {
      background: var(--surface-3);
    }

    .case-filter-row {
      padding: 14px 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--stroke);
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .case-filter-row::-webkit-scrollbar {
      display: none;
    }

    .case-filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: #ffffff;
      color: var(--ink-soft);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .case-filter-chip:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .case-filter-chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .case-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 24px;
    }

    .case-list-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .case-card {
      background: #ffffff;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .case-card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--blue-faint);
    }

    .case-card-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--surface-2);
    }

    .case-card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .case-card:hover .case-card-image {
      transform: scale(1.05);
    }

    .case-card-tag-on-image {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: none;
      font-size: 11px;
      padding: 3px 10px;
      z-index: 1;
    }

    .case-card-body {
      padding: 14px 16px 16px;
    }

    .case-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .case-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--deep-blue);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .case-card-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--blue-faint);
      color: var(--blue);
      font-weight: 500;
      white-space: nowrap;
      border: 1px solid var(--blue-soft);
    }

    .case-card-desc {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .case-card-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }

    .case-detail-back {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .case-detail-back:hover {
      text-decoration: underline;
    }

    .case-detail-image-wrapper {
      width: calc(100% + 48px);
      margin: -12px -24px 0;
      overflow: hidden;
      border-radius: 0;
    }

    .case-detail-image {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .case-detail-content {
      max-height: none;
    }

    .case-detail-section {
      margin-bottom: 16px;
    }

    .case-detail-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .case-detail-text {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.7;
    }

    .case-floating-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 50;
    }

    /* 评分面板 */
    .score-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 16px;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .score-dimension {
      font-size: 15px;
      font-weight: 600;
      color: var(--deep-blue);
    }

    .score-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue);
    }

    .score-bar {
      height: 8px;
      background: var(--line-soft);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--deep-blue));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .score-fill.high { background: linear-gradient(90deg, var(--mint), #1A8070); }
    .score-fill.medium { background: linear-gradient(90deg, #F0C840, #E0A020); }
    .score-fill.low { background: linear-gradient(90deg, var(--coral), #C04040); }

    .score-feedback {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.6;
      padding: 10px 14px;
      background: var(--paper-dark);
      border-radius: 8px;
      border-left: 3px solid var(--blue);
    }

    .total-score-box {
      background: linear-gradient(135deg, var(--deep-blue) 0%, var(--blue) 100%);
      border-radius: 16px;
      padding: 32px;
      color: white;
      text-align: center;
      margin-bottom: 24px;
    }

    .total-score-label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .total-score-number {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
    }

    .total-score-number span {
      font-size: 24px;
      opacity: 0.7;
      font-weight: 400;
    }

    .total-score-grade {
      font-size: 18px;
      font-weight: 600;
      margin-top: 8px;
    }

    .score-legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.8;
    }

    .score-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* 调研方法卡片 */
    .research-method-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .research-method-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      background: var(--paper);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .research-method-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--blue);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .research-method-card:hover::before,
    .research-method-card.selected::before {
      transform: scaleX(1);
    }

    .research-method-card:hover,
    .research-method-card.selected {
      border-color: var(--blue);
      box-shadow: 0 4px 12px rgba(30, 95, 224, 0.1);
    }

    .research-method-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--blue-faint);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .research-method-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--deep-blue);
      margin-bottom: 4px;
    }

    .research-method-desc {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .research-method-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: var(--ink-faint);
    }

    .research-detail-panel {
      background: var(--paper-dark);
      border-radius: 12px;
      padding: 24px 28px;
      margin-top: 8px;
      border: 1px solid var(--line);
    }

    .research-detail-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--deep-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .research-steps {
      list-style: none;
      padding: 0;
    }

    .research-steps li {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line);
    }

    .research-steps li:last-child {
      border-bottom: none;
    }

    .research-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .research-step-text {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.6;
      flex: 1;
    }

    .research-pros-cons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .research-pros, .research-cons {
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .research-pros {
      background: #E8F8F3;
      color: #1A6B5A;
    }

    .research-cons {
      background: #FFF0EC;
      color: #B04A3E;
    }

    .research-pros-title, .research-cons-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* ===== 登录页 ===== */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--paper);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg, #fff);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 36px 32px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
    }

    .login-brand-text {
      display: flex;
      flex-direction: column;
    }

    .login-brand-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--blue);
    }

    .login-brand-sub {
      font-size: 12px;
      color: var(--ink-faint);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--ink-faint);
      margin: 0 0 28px;
      line-height: 1.6;
    }

    .login-field {
      margin-bottom: 18px;
    }

    .login-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .login-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-faint);
    }

    .login-pwd-row {
      position: relative;
    }

    .login-pwd-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      opacity: 0.6;
    }

    .login-pwd-toggle:hover {
      opacity: 1;
    }

    .login-error {
      font-size: 13px;
      color: var(--coral, #E8726A);
      background: rgba(232, 114, 106, 0.08);
      border: 1px solid rgba(232, 114, 106, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .login-submit {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 4px;
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-tip {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/steps.jsx"></script>
  <script type="text/babel" src="components/extra.jsx"></script>
  <script type="text/babel" src="components/login.jsx"></script>
  <script type="text/babel" src="components/App.jsx"></script>
</body>
</html>
